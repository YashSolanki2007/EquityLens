[project]
name = "equity-research-api"
version = "0.1.0"
description = "Local-first semantic equity research prototype API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3",
    "httpx>=0.27",
    "tenacity>=9.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "PyMuPDF>=1.24",
    "pandas>=2.2",
    "scipy>=1.13",
    "yfinance>=1.0.0",
    "openpyxl>=3.1",
    "statsmodels>=0.14.6",
    "statsforecast>=2.1.1,<3",
    "arch>=7.2",
    "scikit-learn>=1.6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "greenlet>=3.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires running Postgres/Ollama/network (deselect with '-m \"not integration\"')",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]  # B008: Depends() in defaults is the FastAPI idiom

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
